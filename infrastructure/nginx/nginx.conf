user nginx;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Rate limiting zone keyed on client TCP connection IP ($binary_remote_addr)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=100r/s;

    server {
        listen 80;
        server_name _;

        # Meta Webhooks
        location /webhooks/ {
            proxy_pass http://webhook-ingestion:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend Monolith (API)
        location /api/ {
            limit_req zone=api_limit burst=200 nodelay;

            # CORS preflight handling
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $http_origin always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-ID, X-Tenant-Slug' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://backend-monolith:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static Next.js assets with no-cache so updates apply instantly across browsers
        location /_next/static/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
        }

        # Dynamic public booking page for any client slug (e.g. /{slug}/book)
        location ~ ^/[^/]+/book$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
            try_files $uri $uri.html /dashboard/book.html =404;
        }

        # Dynamic public review page for any client slug (e.g. /{slug}/review)
        location ~ ^/[^/]+/review$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
            try_files $uri $uri.html /dashboard/review.html =404;
        }

        # Serve Next.js frontend pages with strict no-cache so browsers always get fresh updates
        location / {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
            try_files $uri $uri.html $uri/ /index.html;
        }
    }
}
