version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: whatsapp_platform
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command: >
      postgres
        -c shared_buffers=64MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c max_connections=50
        -c wal_level=minimal
        -c max_wal_senders=0
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    mem_limit: 128m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 28mb
        --maxmemory-policy allkeys-lru
        --save ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 32m

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend_dist:/usr/share/nginx/html:ro
    mem_limit: 32m
    depends_on:
      - webhook-ingestion
      - backend-monolith

  webhook-ingestion:
    build: ./services/webhook-ingestion
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      PORT: 3001
    depends_on:
      - redis
      - postgres
    mem_limit: 128m

  backend-monolith:
    build: ./services/backend-monolith
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PORT: 8000
    volumes:
      - ./services/crm-api:/app/crm_api
      - ./services/auth-service:/app/auth_service
      - ./services/booking-service:/app/booking_service
      - ./services/calendar-sync:/app/calendar_sync
      - ./services/core-worker:/app/core_worker
    depends_on:
      - redis
      - postgres
    mem_limit: 256m

volumes:
  postgres_data:
  redis_data:
